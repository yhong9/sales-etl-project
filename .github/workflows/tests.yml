name: Python Tests

on:
  #代码被推送到main时运行
  push:
    branches:
      - main
  #准备将代码合并到main时运行
  pull_request:
    branches:
      - main
  #可以手动触发
  workflow_dispatch:

permissions:
  contents: read

jobs:
  #一个名为test的工作

  test:
    #运行系统
    runs-on: ubuntu-latest
    steps:
      #下载仓库
      - name: Check out repository
        uses: actions/checkout@v6
      #安装Python
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      #安装依赖
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      #运行test
      - name: Run unit tests with coverage
        run: >
          python -m pytest
          -m "not integration"
          --cov=scripts/olist
          --cov-report=term-missing
          -v
          -p no:cacheprovider
  #一个名为integration test的工作

  integration-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: olist_test

        ports:
          - 5432:5432

        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RUN_INTEGRATION_TESTS: "1"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: olist_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run PostgreSQL integration tests
        run: >
          python -m pytest
          -m integration
          -v
          -p no:cacheprovider